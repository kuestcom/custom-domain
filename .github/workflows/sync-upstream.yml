name: Sync Kuest updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kuest-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'kuestcom/custom-domain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto Kuest
        shell: bash
        run: |
          set -euo pipefail

          domain="$(node scripts/get-domain.mjs)"

          git config user.name "kuest-sync[bot]"
          git config user.email "kuest-sync[bot]@users.noreply.github.com"
          git remote add kuest-upstream https://github.com/kuestcom/custom-domain.git
          git fetch kuest-upstream main
          git rebase -X ours kuest-upstream/main

          node scripts/set-domain.mjs "$domain"
          git add wrangler.jsonc
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve custom domain"
          fi

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
